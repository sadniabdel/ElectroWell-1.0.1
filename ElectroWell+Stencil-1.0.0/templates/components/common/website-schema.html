{{!-- WebSite JSON-LD Schema with Site Search --}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{settings.store_name}}",
  "url": "{{settings.store_url}}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{urls.search}}?search_query={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>
