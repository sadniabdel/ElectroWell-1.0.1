{{!-- BreadcrumbList JSON-LD Schema --}}
{{#if breadcrumbs}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{#each breadcrumbs}}
    {
      "@type": "ListItem",
      "position": {{add @index 1}},
      "name": {{json name}},
      "item": "{{#if url}}{{url}}{{else}}{{../canonical_url}}{{/if}}"
    }{{#unless @last}},{{/unless}}
    {{/each}}
  ]
}
</script>
{{/if}}
